name: Deploy Admin Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Match GitHub Pages build_type=workflow. Do not cancel in-progress deploys —
# cancel-in-progress was aborting pages-build-deployment and leaving the CDN stale.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finance recovery SSOT guard
        run: bash scripts/check-finance-recovery-ssot.sh

      - name: Finance payout SSOT parity guard
        run: bash scripts/check-finance-payout-ssot-parity.sh

      - name: Build
        run: npm run build
        env:
          # Apex custom domain adminonecab.net — site root (not /admin-new/)
          GITHUB_PAGES: ""
          VITE_SUPABASE_URL: https://thazislrdkjpvvghtvzo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoYXppc2xyZGtqcHZ2Z2h0dnpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc4NzA1MjIsImV4cCI6MjA4MzQ0NjUyMn0.pXaycIz1t7JXuItyqvjNNrFsZpsaXbB5bV1OWSQLbWM
          VITE_SUPABASE_PROJECT_ID: thazislrdkjpvvghtvzo

      - name: SPA fallback + custom domain
        run: |
          cp dist/index.html dist/404.html
          printf 'adminonecab.net\n' > dist/CNAME
          touch dist/.nojekyll
          test -f dist/auth/revolut/callback/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
